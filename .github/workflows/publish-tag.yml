name: publish to Steam, then tag (approval gated)
# Everything that runs comes from the pinned commit: the scripts, the change note (PUBLICATION.md)
# and the release notes (CHANGELOG.md), so a later commit to main cannot change what is uploaded
# after the dry-run. Only this workflow file itself is read from the dispatched branch.
#
# If the upload succeeds and the tag-and-release job fails, use "Re-run failed jobs", never
# "Re-run all jobs": the second one uploads to Steam again. A publish run also refuses to start
# when tag v<version> already exists, since that tag is created only after a successful upload.
"on":
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit whose Mod/ directory is uploaded. Publish needs a full 40-character SHA.
        required: true
        default: main
      version:
        description: Version being published, without the v. The tag v<version> is created after a successful upload.
        required: true
        default: 1.0.2
      mode:
        description: Dry-run stages and checks only. Publish needs steam-production approval.
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
concurrency:
  group: steam-publish
  cancel-in-progress: false
permissions:
  contents: read
env:
  WORKSHOP_ID: '3805383957'
  EXPECTED_PACKAGE_ID: nelim.skillicons
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'publish' && 'steam-production' || 'release-dry-run' }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      REF: ${{ inputs.ref }}
      VERSION: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Validate the inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.2.3, got '$VERSION'" >&2; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "ref contains characters that are not allowed: '$REF'" >&2; exit 1; }
          # The approval gate comes before this job starts, so a branch or tag name could move
          # while the run waits for approval. Publishing takes the exact commit the dry-run printed.
          if [[ "$MODE" == publish && ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "publish needs a full 40-character commit SHA as ref (the dry-run summary prints it), got '$REF'" >&2; exit 1
          fi

      - name: Check out the commit to publish
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the commit and check it is publishable
        id: resolve
        working-directory: release
        run: |
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha is not on main" >&2; exit 1; }
          if [[ "$REF" =~ ^[0-9a-f]{40}$ && "$sha" != "$REF" ]]; then
            echo "checked out $sha but ref asked for $REF" >&2; exit 1
          fi
          if existing="$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}")"; then
            if [[ "$existing" != "$sha" ]]; then
              echo "tag v$VERSION already exists on $existing, not on $sha" >&2; exit 1
            fi
            if [[ "$MODE" == publish ]]; then
              echo "tag v$VERSION already exists on this commit, so it was already uploaded. Use 'Re-run failed jobs' on the earlier run if only the release is missing." >&2; exit 1
            fi
          fi
          [[ -f .github/scripts/steam-publish.mjs ]] || { echo "$sha has no .github/scripts/steam-publish.mjs: publish a commit that contains the workflow scripts" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Publishing $sha as version $VERSION"
          echo "Commit $sha, version $VERSION, mode $MODE. To publish exactly this commit, dispatch with ref=$sha." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the release notes exist
        run: bash release/.github/scripts/changelog-section.sh release/CHANGELOG.md "$VERSION" | head -5

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install the Steam upload library
        working-directory: release
        run: npm install --no-save --ignore-scripts --no-audit --no-fund semantic-release-steam@2.1.3

      - name: Steam login
        if: inputs.mode == 'publish'
        uses: RimWorks/mod-ci/.github/actions/steam-login@931aff082d97c7746323da89c840e370f7001915 # v1.10, pinned: it receives the Steam session
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

      - name: Stage, check and ${{ inputs.mode == 'publish' && 'upload' || 'dry-run' }}
        working-directory: release
        env:
          TAG_DIR: ${{ github.workspace }}/release
          DRY_RUN: ${{ inputs.mode == 'publish' && 'false' || 'true' }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: node .github/scripts/steam-publish.mjs

  tag-and-release:
    needs: publish
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.publish.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the published commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the tag and the GitHub release
        run: |
          if existing="$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}")" && [[ "$existing" != "$SHA" ]]; then
            echo "tag v$VERSION exists on $existing, not on $SHA" >&2; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION already exists, nothing to do"; exit 0
          fi
          bash .github/scripts/changelog-section.sh CHANGELOG.md "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Skill Icons $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
